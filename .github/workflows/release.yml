name: Release

on:
  schedule:
    # 02:00 UTC daily (03:00 CET / 04:00 CEST in France)
    - cron: "0 2 * * *"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        required: true
        default: "on-demand"
        options:
          - on-demand
          - nightly
          - release
      skip_tests:
        description: "Skip tests (on-demand only)"
        type: boolean
        required: false
        default: false
      release_notes:
        description: "Extra release notes (optional)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  init:
    name: 1. Initialize & check commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.meta.outputs.should_run }}
      release_kind: ${{ steps.meta.outputs.release_kind }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      calver: ${{ steps.meta.outputs.calver }}
      date_utc: ${{ steps.meta.outputs.date_utc }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      bundles_win: ${{ steps.meta.outputs.bundles_win }}
      zip_level: ${{ steps.meta.outputs.zip_level }}
      opt_level: ${{ steps.meta.outputs.opt_level }}
      lto: ${{ steps.meta.outputs.lto }}
      cgu: ${{ steps.meta.outputs.cgu }}
      skip_tests: ${{ steps.meta.outputs.skip_tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Compute release metadata and check Nightly deduplication
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TYPE: ${{ inputs.release_type }}
          INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            KIND="nightly"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            KIND="release"
          else
            KIND="$INPUT_TYPE"
          fi

          YEAR2="$(date -u +%y)"
          MONTH="$(date -u +%-m)"
          DAY="$(date -u +%-d)"
          CALVER="${YEAR2}.${MONTH}.${DAY}"
          STAMP="$(date -u +%Y.%m.%d-%H%M)"
          DATE_UTC="$(date -u '+%Y-%m-%d %H:%M UTC')"

          SHOULD_RUN="true"
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            PREV_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
              --jq '[.[] | select(.tagName | startswith("nightly-"))][0].tagName // ""')"
            if [[ -n "$PREV_TAG" ]]; then
              PREV_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PREV_TAG}" --jq '.sha // ""' || true)"
              echo "Latest nightly tag: $PREV_TAG ($PREV_SHA)"
              echo "Current HEAD: $COMMIT_SHA"
              if [[ -n "$PREV_SHA" && "$PREV_SHA" == "$COMMIT_SHA" ]]; then
                echo "No new commit since $PREV_TAG; skipping scheduled Nightly."
                SHOULD_RUN="false"
              fi
            fi
          fi

          if [[ "$KIND" == "release" ]]; then
            TAG="${REF_NAME}"
            if [[ "$EVENT_NAME" != "push" ]]; then
              TAG="v${CALVER}"
            elif [[ "${REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              CALVER="${REF_NAME#v}"
            fi
            TITLE="Bricks ${TAG}"
            PRERELEASE="false"
            BUNDLES_WIN="msi,nsis"
            ZIP_LEVEL="9"
            OPT_LEVEL="3"
            LTO="thin"
            CGU="4"
            SKIP_TESTS="false"
          elif [[ "$KIND" == "nightly" ]]; then
            TAG="nightly-${STAMP}"
            TITLE="Bricks Nightly ${STAMP}"
            PRERELEASE="true"
            BUNDLES_WIN="nsis"
            ZIP_LEVEL="6"
            OPT_LEVEL="2"
            LTO="off"
            CGU="32"
            SKIP_TESTS="false"
          else
            TAG="odr-${STAMP}"
            TITLE="Bricks On-Demand ${STAMP}"
            PRERELEASE="true"
            BUNDLES_WIN="nsis"
            ZIP_LEVEL="1"
            OPT_LEVEL="2"
            LTO="off"
            CGU="32"
            if [[ "$INPUT_SKIP_TESTS" == "true" ]]; then
              SKIP_TESTS="true"
            else
              SKIP_TESTS="false"
            fi
          fi

          echo "Source lockfile SHA-256:"
          sha256sum Cargo.toml Cargo.lock apps/bricks-desktop/package-lock.json

          {
            echo "should_run=${SHOULD_RUN}"
            echo "release_kind=${KIND}"
            echo "tag=${TAG}"
            echo "title=${TITLE}"
            echo "calver=${CALVER}"
            echo "date_utc=${DATE_UTC}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "prerelease=${PRERELEASE}"
            echo "bundles_win=${BUNDLES_WIN}"
            echo "zip_level=${ZIP_LEVEL}"
            echo "opt_level=${OPT_LEVEL}"
            echo "lto=${LTO}"
            echo "cgu=${CGU}"
            echo "skip_tests=${SKIP_TESTS}"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: 2. Formatting & Clippy
    needs: init
    if: needs.init.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.init.outputs.commit_sha }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential file

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/bricks-desktop/package-lock.json

      - name: Frontend checks & build (required for Tauri embed)
        working-directory: apps/bricks-desktop
        run: |
          npm ci
          npm run tokens:check
          npm run check
          npm run test:types
          npm run build

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "lint"

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: 3. Quality assurance (nextest)
    needs: [init, lint]
    if: needs.init.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      tests_status: ${{ steps.outcome.outputs.tests_status }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.init.outputs.commit_sha }}

      - name: Free disk space
        if: needs.init.outputs.skip_tests != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Tauri system dependencies
        if: needs.init.outputs.skip_tests != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential file

      - name: Rust toolchain (rust-toolchain.toml)
        if: needs.init.outputs.skip_tests != 'true'
        run: rustup toolchain install && rustc --version

      - uses: actions/setup-node@v5
        if: needs.init.outputs.skip_tests != 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/bricks-desktop/package-lock.json

      - name: Desktop unit tests & frontend build
        if: needs.init.outputs.skip_tests != 'true'
        working-directory: apps/bricks-desktop
        run: |
          npm ci
          npm run test:unit
          npm run build

      - uses: Swatinem/rust-cache@v2
        if: needs.init.outputs.skip_tests != 'true'
        with:
          prefix-key: "test"

      - uses: taiki-e/install-action@v2
        if: needs.init.outputs.skip_tests != 'true'
        with:
          tool: cargo-nextest

      - name: Rust tests (nextest)
        if: needs.init.outputs.skip_tests != 'true'
        run: cargo nextest run --workspace --locked --profile ci

      - name: Rust doc tests
        if: needs.init.outputs.skip_tests != 'true'
        run: cargo test --workspace --doc --locked

      - name: Record test outcome
        id: outcome
        run: |
          if [[ "${{ needs.init.outputs.skip_tests }}" == "true" ]]; then
            echo "tests_status=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "tests_status=passed" >> "$GITHUB_OUTPUT"
          fi

  security_audit:
    name: 4. Security audit (secrets)
    needs: [init, test]
    if: needs.init.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.init.outputs.commit_sha }}

      - name: Repository secret check
        run: python3 scripts/check_secrets.py --tracked

      - name: Verify release helper scripts
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Install & run Gitleaks on source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TMP_GL="$(mktemp -d)"
          gh release download -R gitleaks/gitleaks -D "$TMP_GL" \
            -p "*_linux_x64.tar.gz" -p "*checksums.txt"
          (cd "$TMP_GL" && sha256sum --ignore-missing -c *checksums.txt)
          tar -xzf "$TMP_GL"/*_linux_x64.tar.gz -C "$TMP_GL" gitleaks
          "$TMP_GL/gitleaks" dir . --no-banner

  build:
    name: 5. Build (${{ matrix.platform }})
    needs: [init, security_audit]
    if: needs.init.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ needs.init.outputs.opt_level }}
      CARGO_PROFILE_RELEASE_LTO: ${{ needs.init.outputs.lto }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ needs.init.outputs.cgu }}
      CARGO_PROFILE_RELEASE_STRIP: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.init.outputs.commit_sha }}

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/bricks-desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "build-${{ needs.init.outputs.release_kind }}-${{ matrix.platform }}"

      - name: Install desktop frontend dependencies
        working-directory: apps/bricks-desktop
        run: npm ci

      - name: Build Bricks Desktop (macOS ARM64)
        if: matrix.platform == 'macos-arm64'
        working-directory: apps/bricks-desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.init.outputs.release_kind == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          CALVER="${{ needs.init.outputs.calver }}"
          KIND="${{ needs.init.outputs.release_kind }}"
          UPDATER_FLAG="false"
          if [[ "$KIND" == "release" ]]; then
            UPDATER_FLAG="true"
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
          fi

          npx --no-install tauri build \
            --target "${{ matrix.target }}" \
            --bundles dmg,app \
            --config "{\"version\":\"${CALVER}\",\"bundle\":{\"createUpdaterArtifacts\":${UPDATER_FLAG}}}" \
            -- --locked

          OUT_DIR="${{ github.workspace }}/release-artifacts"
          mkdir -p "$OUT_DIR"
          BUNDLE_DIR="${{ github.workspace }}/target/${{ matrix.target }}/release/bundle"

          DMG_PATH="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          APP_PATH="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$DMG_PATH" && test -d "$APP_PATH"

          cp "$DMG_PATH" "$OUT_DIR/Bricks_${CALVER}_macos-arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT_DIR/Bricks_${CALVER}_macos-arm64.zip"

          if [[ "$KIND" == "release" ]]; then
            UPDATER_TGZ="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app.tar.gz' | head -n 1)"
            UPDATER_SIG="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app.tar.gz.sig' | head -n 1)"
            test -f "$UPDATER_TGZ" && test -f "$UPDATER_SIG"
            cp "$UPDATER_TGZ" "$OUT_DIR/Bricks_${CALVER}_macos-arm64.app.tar.gz"
            cp "$UPDATER_SIG" "$OUT_DIR/Bricks_${CALVER}_macos-arm64.app.tar.gz.sig"
          fi

      - name: Build Bricks Desktop (Windows x64)
        if: matrix.platform == 'windows-x64'
        working-directory: apps/bricks-desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.init.outputs.release_kind == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          $CalVer = "${{ needs.init.outputs.calver }}"
          $Kind = "${{ needs.init.outputs.release_kind }}"
          $Target = "${{ matrix.target }}"
          $Bundles = "${{ needs.init.outputs.bundles_win }}"
          $ZipLevel = "${{ needs.init.outputs.zip_level }}"
          $UpdaterFlag = ($Kind -eq "release")
          if ($UpdaterFlag -and [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is required for official releases"
          }
          $CfgFile = Join-Path $env:RUNNER_TEMP "tauri-version.json"
          @{
            version = $CalVer
            bundle = @{ createUpdaterArtifacts = $UpdaterFlag }
          } | ConvertTo-Json -Compress | Set-Content -Path $CfgFile -Encoding utf8NoBOM

          npx --no-install tauri build `
            --target $Target `
            --bundles $Bundles `
            --config $CfgFile `
            -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Root = "${{ github.workspace }}"
          $OutDir = Join-Path $Root "release-artifacts"
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null

          $RelDir = Join-Path $Root "target\$Target\release"
          $BundleDir = Join-Path $RelDir "bundle"

          $NsisExe = Get-ChildItem -Path (Join-Path $BundleDir "nsis") -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $NsisExe) { throw "NSIS setup.exe not found" }
          Copy-Item $NsisExe.FullName (Join-Path $OutDir "Bricks_${CalVer}_windows-x64-setup.exe")
          if ($Kind -eq "release") {
            $NsisSig = "$($NsisExe.FullName).sig"
            if (-not (Test-Path $NsisSig)) { throw "NSIS updater signature not found: $NsisSig" }
            Copy-Item $NsisSig (Join-Path $OutDir "Bricks_${CalVer}_windows-x64-setup.exe.sig")
          }

          if ($Bundles -like "*msi*") {
            $Msi = Get-ChildItem -Path (Join-Path $BundleDir "msi") -Filter "*.msi" | Select-Object -First 1
            if (-not $Msi) { throw "MSI installer not found" }
            Copy-Item $Msi.FullName (Join-Path $OutDir "Bricks_${CalVer}_windows-x64.msi")
            if ($Kind -eq "release") {
              $MsiSig = "$($Msi.FullName).sig"
              if (-not (Test-Path $MsiSig)) { throw "MSI updater signature not found: $MsiSig" }
              Copy-Item $MsiSig (Join-Path $OutDir "Bricks_${CalVer}_windows-x64.msi.sig")
            }
          }

          $Stage = Join-Path $Root "zip-stage\Bricks"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          $RawExe = Join-Path $RelDir "bricks-desktop.exe"
          if (-not (Test-Path $RawExe)) { throw "bricks-desktop.exe not found" }
          Copy-Item $RawExe (Join-Path $Stage "Bricks.exe")
          $WebViewDll = Join-Path $RelDir "WebView2Loader.dll"
          if (Test-Path $WebViewDll) {
            Copy-Item $WebViewDll (Join-Path $Stage "WebView2Loader.dll")
          }

          $ZipOut = Join-Path $OutDir "Bricks_${CalVer}_windows-x64.zip"
          Push-Location (Join-Path $Root "zip-stage")
          & 7z a -tzip "-mx=${ZipLevel}" $ZipOut "Bricks"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Record pre-scan SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/release-artifacts"
          {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum *
            else
              shasum -a 256 *
            fi
          } | sed 's/^\([0-9a-f]\{64\}\) \*/\1  /' > "sha256sums-build-${{ matrix.platform }}.txt"
          cat "sha256sums-build-${{ matrix.platform }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 3

  scan_and_verify:
    name: 6-7. ClamAV, VirusTotal & SHA-256 re-check
    needs: [init, build]
    if: needs.init.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.init.outputs.commit_sha }}

      - uses: actions/download-artifact@v4
        with:
          path: downloaded-builds
          pattern: build-*
          merge-multiple: true

      - name: Verify pre-scan SHA-256 integrity
        run: |
          set -euo pipefail
          mkdir -p dist
          cd downloaded-builds
          sha256sum -c sha256sums-build-*.txt
          cp sha256sums-build-*.txt ../
          find . -maxdepth 1 -type f ! -name 'sha256sums-build-*.txt' -exec mv {} ../dist/ \;

      - name: Cache ClamAV virus definitions
        uses: actions/cache@v4
        with:
          path: /var/lib/clamav
          key: clamav-db-${{ runner.os }}-${{ needs.init.outputs.calver }}
          restore-keys: |
            clamav-db-${{ runner.os }}-

      - name: Install ClamAV and scan artifacts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          sudo systemctl stop clamav-freshclam || true
          sudo mkdir -p /var/lib/clamav
          sudo chown -R clamav:clamav /var/lib/clamav
          sudo freshclam --log=/tmp/freshclam.log || echo "Warning: freshclam update failed; using cached/packaged database."
          sudo chmod -R a+rX /var/lib/clamav
          clamscan --database=/var/lib/clamav --recursive --infected --no-summary dist/

      - name: Scan artifacts with VirusTotal API
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/virustotal_scan.py dist \
            --summary-out vt-summary.md \
            --max-malicious 5

      - name: 7. Re-verify post-scan SHA-256 integrity
        run: |
          set -euo pipefail
          mkdir -p release-final
          cat sha256sums-build-*.txt | LC_ALL=C sort -k2 > expected-sums.txt
          (cd dist && sha256sum -c ../expected-sums.txt)
          (cd dist && sha256sum *) | LC_ALL=C sort -k2 > release-final/SHA256SUMS.txt
          diff -u expected-sums.txt release-final/SHA256SUMS.txt
          cp dist/* release-final/
          cp vt-summary.md release-final/vt-summary.md

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: release-final/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: 8. Attest & publish release
    needs: [init, test, scan_and_verify]
    if: needs.init.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.init.outputs.commit_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: release-payload

      - name: Separate metadata from release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          mv release-payload/vt-summary.md vt-summary.md
          mv release-payload/* assets/
          (cd assets && sha256sum -c SHA256SUMS.txt)

      - name: Generate Tauri updater manifest (latest.json)
        if: needs.init.outputs.release_kind == 'release'
        env:
          EXTRA_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          PUB_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python3 .github/scripts/build_updater_manifest.py \
            --assets-dir assets \
            --version "${{ needs.init.outputs.calver }}" \
            --tag "${{ needs.init.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pub-date "$PUB_DATE" \
            --notes="$EXTRA_NOTES" \
            --out assets/latest.json
          (cd assets && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | LC_ALL=C sort | xargs sha256sum) > assets/SHA256SUMS.txt
          (cd assets && sha256sum -c SHA256SUMS.txt)

      - name: Generate GitHub build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "assets/*"

      - name: Render release notes
        env:
          EXTRA_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          python3 .github/scripts/render_release_notes.py \
            --release-kind "${{ needs.init.outputs.release_kind }}" \
            --title "${{ needs.init.outputs.title }}" \
            --tag "${{ needs.init.outputs.tag }}" \
            --date-utc "${{ needs.init.outputs.date_utc }}" \
            --version "${{ needs.init.outputs.calver }}" \
            --commit-sha "${{ needs.init.outputs.commit_sha }}" \
            --tests-status "${{ needs.test.outputs.tests_status }}" \
            --vt-summary-file vt-summary.md \
            --repo "$GITHUB_REPOSITORY" \
            --extra-notes="$EXTRA_NOTES" \
            --out release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FLAGS=(
            --repo "$GITHUB_REPOSITORY"
            --target "${{ needs.init.outputs.commit_sha }}"
            --title "${{ needs.init.outputs.title }}"
            --notes-file release-notes.md
          )
          if [[ "${{ needs.init.outputs.prerelease }}" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${{ needs.init.outputs.tag }}" "${FLAGS[@]}" assets/*

      - name: Prune old Nightly & ODR pre-releases (keep last 7 nightly, 5 odr)
        if: needs.init.outputs.release_kind != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prune_prefix() {
            local prefix="$1"
            local keep="$2"
            local tags
            tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
              --jq "[.[] | select(.isPrerelease and (.tagName | startswith(\"${prefix}\")))][${keep}:] | .[].tagName")"
            for old_tag in $tags; do
              echo "Deleting old pre-release: $old_tag"
              gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done
          }
          prune_prefix "nightly-" 7
          prune_prefix "odr-" 5
